apiVersion: networking.istio.io/v1alpha3
kind: Gateway
metadata:
  name: cinemaabyss-gateway
  namespace: cinemaabyss
spec:
  selector:
    istio: ingressgateway
  servers:
  - port:
      number: 80
      name: http
      protocol: HTTP
    hosts:
    - "cinemaabyss.example.com"
---
apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: cinemaabyss-vs
  namespace: cinemaabyss
spec:
  hosts:
  - "cinemaabyss.example.com"
  gateways:
  - cinemaabyss-gateway
  http:
  - route:
    - destination:
        host: proxy-service.cinemaabyss.svc.cluster.local
        port:
          number: 8000
